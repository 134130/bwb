source_dir: .mise/tasks

pre-commit:
  jobs:
    - name: tidy
      glob: "*.go"
      run: mise run tidy
      stage_fixed: true
    - name: golangci-lint
      glob: "*.go"
      run: mise run fmt -- {staged_files}
      stage_fixed: true
    - name: test
      glob: "*.go"
      run: mise run test
    - name: integration
      script: integration
      runner: sh
