name: bwb-dev
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    ports:
      - "127.0.0.1:8222:80"
    environment:
      DOMAIN: http://localhost:8222
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
    volumes:
      - vaultwarden-data:/data
volumes:
  vaultwarden-data:
